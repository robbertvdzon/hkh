services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hkh
      POSTGRES_USER: hkh
      POSTGRES_PASSWORD: hkh
    ports:
      - "5434:5432"
    volumes:
      - hkh-dev-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkh -d hkh"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hkh-dev-database:
