apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-host-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:postgresql-host-backup
subjects:
  - kind: ServiceAccount
    name: postgres-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "15 2 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          securityContext:
            seLinuxOptions:
              type: spc_t
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: quay.io/sclorg/postgresql-16-c9s:latest
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -ec
                - |
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  filename="hkh-${timestamp}.dump"
                  temporary="/backups/.${filename}.tmp"
                  final="/backups/${filename}"
                  pg_dump --format=custom --compress=6 --file="${temporary}"
                  pg_restore --list "${temporary}" >/dev/null
                  mv "${temporary}" "${final}"
                  cd /backups
                  sha256sum "${filename}" > "${filename}.sha256"
                  find /backups -type f \( -name 'hkh-*.dump' -o -name 'hkh-*.dump.sha256' \) -mtime +30 -delete
              env:
                - name: PGHOST
                  value: database
                - name: PGDATABASE
                  value: hkh
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: hkh-runtime
                      key: HKH_DATABASE_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hkh-runtime
                      key: HKH_DATABASE_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /var/mnt/external-hdd/postgres-backups/hkh
                type: DirectoryOrCreate
