apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hkh
resources:
- ../../base
- postgres-backup.yaml
- sealed-secret-ai-access.yaml
- sealed-central-postgres.yaml
images:
- name: admin-image
  newName: ghcr.io/robbertvdzon/hkh-admin
  newTag: sha-025f14c
- name: backend-image
  newName: ghcr.io/robbertvdzon/hkh-backend
  newTag: sha-7a34c35
- name: frontend-image
  newName: ghcr.io/robbertvdzon/hkh-frontend
  newTag: sha-c351486
patches:
- path: agent-access-patch.yaml
- path: central-postgres-patch.yaml
- path: hkh_prod-retired-database.yaml
- path: retired-backup-patch.yaml

# Public web configuration, separate from the immutable frontend image. The
# generated hash rolls both deployments when configuration changes.
configMapGenerator:
- files:
  - config.json=web-config.json
  name: hkh-web-config
