apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hkh-acceptance
resources:
- ../../base
- acceptance-secret.yaml
- sealed-secret-ai-access.yaml
- sealed-central-postgres.yaml
patches:
- patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 1Gi"
  target:
    kind: PersistentVolumeClaim
    name: database-data
    version: v1
- patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: hkh-runtime"
  target:
    group: bitnami.com
    kind: SealedSecret
    name: hkh-runtime
    version: v1alpha1
- patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: backend"
  target:
    group: route.openshift.io
    kind: Route
    name: backend
    version: v1
- patch: "- op: replace\n  path: /spec/host\n  value: hkh-acceptance.vdzonsoftware.nl"
  target:
    group: route.openshift.io
    kind: Route
    name: frontend
    version: v1
- patch: "- op: replace\n  path: /spec/host\n  value: hkh-admin-acceptance.vdzonsoftware.nl"
  target:
    group: route.openshift.io
    kind: Route
    name: admin
    version: v1
- path: agent-access-patch.yaml
- path: backend-memory.yaml
- path: frontend-memory.yaml
- path: admin-memory.yaml
- path: central-postgres-patch.yaml
- path: hkh_acc-retired-database.yaml
images:
- name: admin-image
  newName: ghcr.io/robbertvdzon/hkh-admin
  newTag: sha-9aee82e-acceptance
- name: backend-image
  newName: ghcr.io/robbertvdzon/hkh-backend
  newTag: sha-4287e9b
- name: frontend-image
  newName: ghcr.io/robbertvdzon/hkh-frontend
  newTag: sha-4cc87c5-acceptance
