apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hkh-acceptance
resources:
  - ../../base
  - acceptance-secret.yaml
patches:
  # De acceptatieomgeving is standing, maar heeft geen productieverkeer; 1Gi is ruim voldoende voor de
  # geseede demodata. Zelfde aanpak als deploy/overlays/preview/kustomization.yaml.
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: database-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: hkh-runtime
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: hkh-runtime
  # De frontend proxit same-origin naar de backend; een losse externe Route voor de backend is niet
  # nodig (zelfde als preview).
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: backend
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: backend
  # Vaste hostnamen voor de standing acceptatieomgeving (geen ArgoCD-templating nodig, er is maar één
  # instantie).
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: frontend
    patch: |-
      - op: replace
        path: /spec/host
        value: hkh-acceptance.vdzonsoftware.nl
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: admin
    patch: |-
      - op: replace
        path: /spec/host
        value: hkh-admin-acceptance.vdzonsoftware.nl
