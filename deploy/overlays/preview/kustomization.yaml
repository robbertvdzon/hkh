apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- preview-secret.yaml
- sealed-secret-ai-access.yaml
patches:
- target:
    version: v1
    kind: PersistentVolumeClaim
    name: database-data
  patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 1Gi"
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
    name: hkh-runtime
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: hkh-runtime"
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: backend
  patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: backend"
- path: agent-access-patch.yaml
