apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: backend-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: hkh-runtime
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70.0
            - name: TZ
              value: Europe/Amsterdam
            - name: HKH_AI_SEARCH_ENABLED
              value: "true"
            - name: HKH_AGENT_RUNTIME_BASE_URL
              value: https://agent-runtime.vdzonsoftware.nl
            - name: HKH_AI_SEARCH_VENDOR_ID
              value: anthropic
            - name: HKH_AI_SEARCH_MODEL
              value: claude-opus-5
            - name: HKH_AI_SEARCH_MODE
              value: SUBSCRIPTION
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
