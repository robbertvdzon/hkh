name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Stage APK
        id: stage
        shell: bash
        run: |
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          short_sha=$(git rev-parse --short HEAD)
          tag="apk-${timestamp}-${short_sha}"
          mkdir -p artifacts
          cp frontend/build/app/outputs/flutter-apk/app-release.apk artifacts/hkh.apk
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: "HKH Android APK"
          files: artifacts/hkh.apk
          make_latest: true
          generate_release_notes: false
