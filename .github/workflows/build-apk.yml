name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Prepare release signing key
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/hkh-release.keystore
          cat > keystore.properties <<EOF
          storeFile=hkh-release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=UPDATE_REPOSITORY=robbertvdzon/hkh \
            --dart-define=UPDATE_RELEASE_TAG=hkh-latest \
            --dart-define=UPDATE_LABEL="HKH-app"

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp frontend/build/app/outputs/flutter-apk/app-release.apk artifacts/hkh.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hkh-latest
          name: "HKH Android APK (laatste build)"
          body: |
            Automatisch gebouwde HKH release-APK. Dit is altijd de nieuwste versie
            (build ${{ github.run_number }}, commit ${{ github.sha }}).
          files: artifacts/hkh.apk
          make_latest: true
          generate_release_notes: false
