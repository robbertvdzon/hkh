name: Repository verification
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: hkh-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: changes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 .github/scripts/test-image-matrix.py
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=main&status=success&event=push&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only "$base" HEAD | python3 .github/scripts/image-matrix.py

  verify:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.image == 'backend'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        if: matrix.image == 'backend'
        run: mvn -B --no-transfer-progress -f backend/pom.xml clean verify
      - uses: subosito/flutter-action@v2
        if: matrix.image != 'backend'
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
          pub-cache-path: ${{ runner.tool_cache }}/pub-${{ matrix.image }}
          pub-cache-key: pub-${{ runner.os }}-${{ matrix.image }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.context)) }}
      - name: Verify frontend
        if: matrix.image != 'backend'
        working-directory: ${{ matrix.context }}
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  repository-verification:
    name: Repository verification
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected component checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$VERIFY_RESULT" == success || "$VERIFY_RESULT" == skipped ]]
