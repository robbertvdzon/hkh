name: Build container images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "frontend-admin/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "frontend-admin/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/build-images.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build-images.yml'
            admin:
              - 'frontend-admin/**'
              - '.github/workflows/build-images.yml'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: metadata
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push user frontend
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: API_BASE_URL=${{ vars.API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push admin frontend
        if: steps.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: frontend-admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Set up Kustomize
        if: github.event_name == 'push'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.0"

      - name: Pin built images in the OpenShift overlay
        if: github.event_name == 'push'
        shell: bash
        working-directory: deploy/overlays/openshift
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          ADMIN_CHANGED: ${{ steps.changes.outputs.admin }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            kustomize edit set image backend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG}
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            kustomize edit set image frontend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG}
          fi
          if [[ "$ADMIN_CHANGED" == "true" ]]; then
            kustomize edit set image admin-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${IMAGE_TAG}
          fi

      - name: Commit GitOps image pins
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- deploy/overlays/openshift/kustomization.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/openshift/kustomization.yaml
          git commit -m "deploy: pin images to ${{ steps.metadata.outputs.tag }} [skip ci]"
          git push
