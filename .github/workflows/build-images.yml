name: Build container images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "frontend-admin/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR's moeten de branch-head bouwen; main moet als branch uitgecheckt
          # blijven zodat de latere GitOps image-pin commit kan pushen.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/build-images.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build-images.yml'
            admin:
              - 'frontend-admin/**'
              - '.github/workflows/build-images.yml'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: metadata
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select runtime build configuration
        id: runtime
        shell: bash
        env:
          PRODUCTION_API_BASE_URL: ${{ vars.API_BASE_URL }}
          PRODUCTION_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "api_base_url=" >> "$GITHUB_OUTPUT"
            echo "google_client_id=" >> "$GITHUB_OUTPUT"
            echo "preview_mode=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_base_url=$PRODUCTION_API_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "google_client_id=$PRODUCTION_GOOGLE_CLIENT_ID" >> "$GITHUB_OUTPUT"
            echo "preview_mode=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        if: github.event_name == 'pull_request' || steps.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: |
            BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push user frontend
        if: github.event_name == 'pull_request' || steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: API_BASE_URL=${{ steps.runtime.outputs.api_base_url }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push admin frontend
        if: github.event_name == 'pull_request' || steps.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: frontend-admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${{ github.event_name == 'push' && 'main' || steps.metadata.outputs.tag }}
          build-args: |
            API_BASE_URL=${{ steps.runtime.outputs.api_base_url }}
            GOOGLE_CLIENT_ID=${{ steps.runtime.outputs.google_client_id }}
            PREVIEW_MODE=${{ steps.runtime.outputs.preview_mode }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      # AppConfig.apiBaseUrl (frontend & frontend-admin) and PREVIEW_MODE/GOOGLE_CLIENT_ID (admin)
      # are compile-time Dart constants (see lib/config/app_config.dart), not runtime env vars.
      # The regular push build above bakes in the real production API_BASE_URL and requires Google
      # login (PREVIEW_MODE=false) — reused as-is by the standing acceptance environment, that would
      # make it silently call the production backend directly (bypassing its own same-origin nginx
      # proxy) and still show a Google sign-in wall for admin. Build the same preview-flavored
      # variant PR-previews already get (blank API_BASE_URL so requests stay same-origin, preview
      # mode on) so the acceptance overlay can pin to it instead.
      - name: Build and push acceptance user frontend
        if: github.event_name == 'push' && steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ steps.metadata.outputs.tag }}-acceptance
          build-args: API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push acceptance admin frontend
        if: github.event_name == 'push' && steps.changes.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend-admin
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${{ steps.metadata.outputs.tag }}-acceptance
          build-args: |
            API_BASE_URL=
            GOOGLE_CLIENT_ID=
            PREVIEW_MODE=true
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Set up Kustomize
        if: github.event_name == 'push'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.0"

      - name: Pin built images in the OpenShift overlay
        if: github.event_name == 'push'
        shell: bash
        working-directory: deploy/overlays/openshift
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          ADMIN_CHANGED: ${{ steps.changes.outputs.admin }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          # Een deploy-only commit kan tijdens de lange imagebuild op main landen. Werk eerst bij,
          # anders zou de latere GitOps-commit non-fast-forward falen en nooit bij ArgoCD komen.
          git pull --rebase origin main
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            kustomize edit set image backend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG}
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            kustomize edit set image frontend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG}
          fi
          if [[ "$ADMIN_CHANGED" == "true" ]]; then
            kustomize edit set image admin-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${IMAGE_TAG}
          fi

      - name: Pin built images in the acceptance overlay
        if: github.event_name == 'push'
        shell: bash
        working-directory: deploy/overlays/acceptance
        env:
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          ADMIN_CHANGED: ${{ steps.changes.outputs.admin }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          # Geen eigen "git pull --rebase" hier: de OpenShift-overlaystap hierboven heeft de
          # working tree al bijgewerkt en laat bewust ongecommitte wijzigingen staan tot de
          # gezamenlijke commit-stap verderop; een tweede rebase-poging zou daardoor stuklopen op
          # "unstaged changes". Backend heeft geen compile-time gebakken configuratie en gebruikt
          # daarom gewoon de productie-tag; frontend en admin krijgen de losse -acceptance-variant
          # (zie de "Build and push acceptance ..." stappen hierboven) omdat hun
          # API_BASE_URL/PREVIEW_MODE/GOOGLE_CLIENT_ID compile-time vastliggen.
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            kustomize edit set image backend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${IMAGE_TAG}
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            kustomize edit set image frontend-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${IMAGE_TAG}-acceptance
          fi
          if [[ "$ADMIN_CHANGED" == "true" ]]; then
            kustomize edit set image admin-image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-admin:${IMAGE_TAG}-acceptance
          fi

      - name: Commit GitOps image pins
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- deploy/overlays/openshift/kustomization.yaml deploy/overlays/acceptance/kustomization.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/openshift/kustomization.yaml deploy/overlays/acceptance/kustomization.yaml
          git commit -m "deploy: pin images to ${{ steps.metadata.outputs.tag }} [skip ci]"
          git push
