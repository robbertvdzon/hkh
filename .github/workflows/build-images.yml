name: Build container images
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-admin/**'
      - '.github/workflows/build-images.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      any: ${{ steps.changes.outputs.any }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      admin: ${{ steps.changes.outputs.admin }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changes
        name: Select components, including changes from failed or cancelled builds
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 .github/scripts/test-image-matrix.py
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-images.yml/runs?branch=main&status=success&event=push&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only "$base" HEAD | python3 .github/scripts/image-matrix.py
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      # Build Flutter directly with the cached SDK/pub cache. The container only
      # packages static files: no multi-GB Flutter image/cache transfer per build.
      - uses: subosito/flutter-action@v2
        if: matrix.image != 'backend'
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
          pub-cache-path: ${{ runner.tool_cache }}/pub-${{ matrix.image }}
          pub-cache-key: pub-${{ runner.os }}-${{ matrix.image }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.context)) }}
      - name: Build one environment-independent frontend
        if: matrix.image != 'backend'
        working-directory: ${{ matrix.context }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --pwa-strategy=none --dart-define=RUNTIME_CONFIG=true
          bash tool/hash-web-bundle.sh
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish component
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.image == 'backend' && 'Dockerfile' || 'Dockerfile.runtime' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.image }}:${{ needs.changes.outputs.tag }}
          build-args: |
            BUILD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_VERSION=${{ needs.changes.outputs.tag }}
          cache-from: type=gha,scope=hkh-${{ matrix.image }}-v2
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=hkh-{0}-v2', matrix.image) || '' }}

  pin-release:
    needs: [changes, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: imranismail/setup-kustomize@v2
        with: {kustomize-version: '5.8.0'}
      - name: Pin the same images for production and acceptance
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          ADMIN_CHANGED: ${{ needs.changes.outputs.admin }}
          IMAGE_TAG: ${{ needs.changes.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Don't let a slow old run overwrite a newer release.
          if ! git diff --quiet "$RELEASE_SHA" HEAD -- backend frontend frontend-admin .github; then
            echo 'A newer source change exists; its run will pin the release.'
            exit 0
          fi
          for component in backend frontend admin; do
            case "$component" in
              backend) changed="$BACKEND_CHANGED" ;;
              frontend) changed="$FRONTEND_CHANGED" ;;
              admin) changed="$ADMIN_CHANGED" ;;
            esac
            if [[ "$changed" != true ]]; then continue; fi
            image="ghcr.io/$GITHUB_REPOSITORY-$component"
            docker buildx imagetools create -t "$image:main" "$image:$IMAGE_TAG"
            for overlay in openshift acceptance; do
              (cd "deploy/overlays/$overlay" && kustomize edit set image "$component-image=$image:$IMAGE_TAG")
            done
          done
          if git diff --quiet -- deploy/overlays; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/overlays/openshift/kustomization.yaml deploy/overlays/acceptance/kustomization.yaml
          git commit -m "deploy: pin images to $IMAGE_TAG [skip ci]"
          git push origin HEAD:main
