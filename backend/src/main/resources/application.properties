spring.application.name=hkh

hkh.version=${HKH_APP_VERSION:0.0.1-SNAPSHOT}
hkh.commit=${HKH_GIT_COMMIT:local}
hkh.cors-allowed-origin-patterns=${HKH_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
hkh.auth.google-client-id=${HKH_GOOGLE_CLIENT_ID:}
hkh.auth.admin-allowed-emails=${HKH_ADMIN_ALLOWED_EMAILS:}
hkh.auth.session-days=${HKH_SESSION_DAYS:365}
hkh.preview.enabled=${HKH_PREVIEW_ENABLED:false}
hkh.preview.marker=${HKH_PREVIEW_MARKER:}
hkh.preview.pr-number=${HKH_PREVIEW_PR_NUMBER:}

spring.datasource.url=${HKH_DATABASE_URL}
spring.datasource.username=${HKH_DATABASE_USER}
spring.datasource.password=${HKH_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

hkh.zcbs.base-url=${HKH_ZCBS_BASE_URL:https://www.historischekringheemskerk.nl}
hkh.zcbs.request-delay-ms=${HKH_ZCBS_REQUEST_DELAY_MS:300}

hkh.ai-search.enabled=${HKH_AI_SEARCH_ENABLED:false}
hkh.ai-search.runtime-base-url=${HKH_AGENT_RUNTIME_BASE_URL:https://agent-runtime.vdzonsoftware.nl}
hkh.ai-search.runtime-token=${HKH_AGENT_RUNTIME_TOKEN:}
hkh.ai-search.vendor-id=${HKH_AI_SEARCH_VENDOR_ID:openai}
hkh.ai-search.model=${HKH_AI_SEARCH_MODEL:gpt-5.6-sol}
hkh.ai-search.mode=${HKH_AI_SEARCH_MODE:SUBSCRIPTION}
hkh.ai-search.execution-timeout-seconds=${HKH_AI_SEARCH_TIMEOUT_SECONDS:900}
hkh.ai-search.poll-interval-ms=${HKH_AI_SEARCH_POLL_INTERVAL_MS:2000}
hkh.ai-search.max-active-searches=${HKH_AI_SEARCH_MAX_ACTIVE:3}
